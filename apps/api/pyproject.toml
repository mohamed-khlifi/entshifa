[project]
name = "ent-api"
version = "0.0.0"
description = "EntShifa FastAPI application"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # P0-02 runtime stack — exact pins for deterministic, fast pip resolves.
    "aiobotocore==2.21.1",
    "aiomysql==0.2.0",
    "cryptography==44.0.2",
    "fastapi==0.115.12",
    "pydantic-settings==2.8.1",
    "redis==5.2.1",
    "uvicorn[standard]==0.34.0",
    # Transitive pins (avoid httpcore/h11 backtracking with httpx + uvicorn).
    "h11==0.16.0",
    "httpcore==1.0.9",
    "starlette==0.46.2",
    "pydantic==2.10.6",
    "anyio==4.8.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
]

[build-system]
requires = ["hatchling==1.26.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: tests that require the local Docker stack",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ent"]
