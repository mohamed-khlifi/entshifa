[project]
name = "ent-api"
version = "0.0.0"
description = "EntShifa FastAPI application"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # P0-02 runtime stack — exact pins for deterministic, fast pip resolves.
    "aiobotocore==2.21.1",
    "aiomysql==0.2.0",
    "cryptography==44.0.2",
    "fastapi==0.115.12",
    "pydantic-settings==2.8.1",
    "redis==5.2.1",
    "uvicorn[standard]==0.34.0",
    # Transitive pins (avoid httpcore/h11 backtracking with httpx + uvicorn).
    "h11==0.16.0",
    "httpcore==1.0.9",
    "starlette==0.46.2",
    "pydantic==2.10.6",
    "anyio==4.8.0",
    # P0-03 database core.
    "alembic==1.15.1",
    "greenlet==3.1.1",
    "pymysql==1.1.1",
    "python-ulid==3.0.0",
    "sqlalchemy[asyncio]==2.0.39",
    # P0-04 security core.
    "argon2-cffi==23.1.0",
    "pyjwt==2.10.1",
    # P0-13 media processing (EXIF strip + thumbnails).
    "Pillow==11.1.0",
]

[project.optional-dependencies]
dev = [
    "black==26.1.0",
    "httpx==0.28.1",
    "import-linter==2.15",
    "mypy==1.15.0",
    "pip-audit==2.9.0",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==7.0.0",
    "ruff==0.11.2",
    "types-PyMySQL==1.1.0.20250916",
]

[build-system]
requires = ["hatchling==1.26.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: tests that require the local Docker stack",
    "clinical: known-answer tests citing a published reference",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.coverage.run]
branch = true
source = ["ent"]
omit = [
    "*/ent/seeds/*",
    "*/ent/cli/*",
    "*/ent/jobs/worker.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.importlinter]
root_package = "ent"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Repositories do not import services"
type = "forbidden"
source_modules = [
    "ent.features.auth.repository",
    "ent.features.attachments.repository",
    "ent.features.clinics.repository",
    "ent.features.terminology.repository",
]
forbidden_modules = [
    "ent.features.auth.service",
    "ent.features.attachments.service",
    "ent.features.health.service",
    "ent.features.terminology.service",
]

[[tool.importlinter.contracts]]
name = "Engines stay pure"
type = "forbidden"
source_modules = ["ent.engines"]
forbidden_modules = [
    "ent.features",
    "ent.integrations",
    "ent.jobs",
    "sqlalchemy",
    "fastapi",
    "httpx",
    "redis",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ent"]

[[tool.mypy.overrides]]
module = [
    "aiomysql",
    "aiomysql.*",
    "aiobotocore",
    "aiobotocore.*",
    "botocore",
    "botocore.*",
    "jwt",
    "jwt.*",
    "PIL",
    "PIL.*",
]
ignore_missing_imports = true
