name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  # Shared Settings for any job that boots the API (APP_ENV must be local|staging|production).
  COMPOSE_PROJECT_NAME: entshifa
  APP_ENV: local
  LOG_LEVEL: INFO
  API_HOST: 0.0.0.0
  API_PORT: "8000"
  WEB_PORT: "3000"
  WEB_URL: http://localhost:3000
  CORS_ORIGINS: http://localhost:3000
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: entshifa
  MYSQL_USER: entshifa
  MYSQL_PASSWORD: ci_mysql_password
  MYSQL_ROOT_PASSWORD: ci_mysql_root
  DATABASE_URL: mysql+aiomysql://entshifa:ci_mysql_password@127.0.0.1:3306/entshifa?charset=utf8mb4
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6379"
  REDIS_URL: redis://127.0.0.1:6379/0
  S3_ENDPOINT: http://127.0.0.1:9000
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: ci_minio_key
  S3_SECRET_ACCESS_KEY: ci_minio_secret
  S3_BUCKET: entshifa-clinical
  MINIO_ROOT_USER: ci_minio_key
  MINIO_ROOT_PASSWORD: ci_minio_secret
  MINIO_API_PORT: "9000"
  MINIO_CONSOLE_PORT: "9001"
  STORAGE_BACKEND: local
  LOCAL_STORAGE_ROOT: /tmp/entshifa-ci-storage
  JWT_ISSUER: entshifa-ci
  JWT_AUDIENCE: entshifa-api
  ACCESS_TOKEN_SECRET: ci_access_token_secret_min_32_chars_long
  REFRESH_TOKEN_SECRET: ci_refresh_token_secret_min_32_chars_long
  ACCESS_TOKEN_TTL_MINUTES: "15"
  REFRESH_TOKEN_TTL_DAYS: "30"
  FIELD_ENCRYPTION_KEY: ci_field_encryption_key_32b_base64==
  SMTP_FROM: noreply@example.local

jobs:
  lint-api:
    name: Lint (API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e "./apps/api[dev]"
      - run: make lint-api

  lint-web:
    name: Lint (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: make lint-web

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install API (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e "./apps/api[dev]"
      - run: npm ci
        working-directory: apps/web
      - run: make typecheck

  import-boundaries:
    name: Import boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e "./apps/api[dev]"
      - run: make import-check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e "./apps/api[dev]"
      - run: make test-unit

  clinical-tests:
    name: Clinical known-answer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e "./apps/api[dev]"
      - run: make test-clinical

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
          MYSQL_USER: ${{ env.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ env.MYSQL_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_mysql_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=40s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e "./apps/api[dev]"
          mkdir -p "${LOCAL_STORAGE_ROOT}"
      - name: Migrate database
        run: make migrate
      - run: make test-integration

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [unit-tests]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
          MYSQL_USER: ${{ env.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ env.MYSQL_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_mysql_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=40s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e "./apps/api[dev]"
          mkdir -p "${LOCAL_STORAGE_ROOT}"
      - name: Migrate database
        run: make migrate
      - run: make test-cov

  contracts:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - name: Install API
        run: |
          python -m pip install --upgrade pip
          pip install -e "./apps/api[dev]"
      - run: npm ci
        working-directory: packages/contracts
      - name: Contract check
        run: node packages/contracts/scripts/check.mjs

  i18n:
    name: Translation check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: make i18n-check

  migration-check:
    name: Migration check
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
          MYSQL_USER: ${{ env.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ env.MYSQL_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_mysql_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=40s
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e "./apps/api[dev]"
      - run: make migrate-check

  web-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: make build-web

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: make build-web
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: make e2e

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install API (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e "./apps/api[dev]"
      - run: npm ci
        working-directory: apps/web
      - run: make security
      - name: Secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --verbose


